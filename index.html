<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Connect 4 - MLOps Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Settings</h2>
            </div>
            
            <div class="section">
                <p class="section-title">Difficulty</p>
                <div class="difficulty-selector">
                    <button class="level-btn" data-level="easy">Easy</button>
                    <button class="level-btn active" data-level="medium">Medium</button>
                    <button class="level-btn" data-level="hard">Hard</button>
                </div>
            </div>

            <div class="section">
                <p class="section-title">Actions</p>
                <button id="reset-btn" class="action-btn">Reset Game</button>
                <button id="retrain-btn" class="action-btn retrain">Retrain AI</button>
            </div>

            <div class="footer">
                <p>MLOps Pipeline v1.0</p>
                <p>Logistic Regression AI</p>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <h1>AI <span>Connect 4</span></h1>
                <div class="game-status" id="status">Your Turn (Red)</div>
            </header>

            <div class="game-board-container">
                <div class="game-board" id="board">
                    <!-- cells generated by script.js -->
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
